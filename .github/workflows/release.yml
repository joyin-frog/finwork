name: Release

# 打 tag（如 v1.0.0）即触发：构建 macOS Apple Silicon / Intel 与 Windows x64，
# 各架构先独立构建，最后合并 macOS 更新元数据并上传到同一个 GitHub draft release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pretest:
    name: Pretest (verify, no e2e)
    uses: ./.github/workflows/ci-verify.yml
    with:
      run_e2e: false

  build:
    needs: pretest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            node_arch: arm64
            py_triple: aarch64-apple-darwin
            electron_args: "--mac --arm64"
            macos: true
          - platform: macos-15-intel
            node_arch: x64
            py_triple: x86_64-apple-darwin
            electron_args: "--mac --x64"
            macos: true
          - platform: windows-latest
            node_arch: x64
            py_triple: x86_64-pc-windows-msvc-shared
            electron_args: "--win --x64"
            macos: false
    runs-on: ${{ matrix.platform }}
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERT != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.node_arch }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Verify native build architecture
        shell: bash
        run: node -e "if (process.arch !== '${{ matrix.node_arch }}') throw new Error('runner architecture '+process.arch+' does not match ${{ matrix.node_arch }}')"

      - name: Require Apple signing and notarization credentials
        if: matrix.macos == true
        shell: bash
        run: test "$HAS_APPLE_SIGNING" = "true"

      - name: Require Windows Authenticode credentials
        if: matrix.macos == false
        shell: bash
        run: test "$HAS_WINDOWS_SIGNING" = "true"

      - name: Verify tag matches package version
        shell: bash
        run: >-
          node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('tag/version mismatch: '+process.env.GITHUB_REF_NAME+' vs v'+p.version)"

      # 首启免下载 Python；prepare-electron 会把归档复制进 standalone workers/。
      - name: Bundle Python runtime archive
        shell: bash
        run: |
          PY_TAG=20240814
          PY_VER=3.12.5
          ASSET="cpython-${PY_VER}+${PY_TAG}-${{ matrix.py_triple }}-install_only.tar.gz"
          BASE="https://github.com/astral-sh/python-build-standalone/releases/download/${PY_TAG}"
          curl -fSL "$BASE/$ASSET" -o workers/python-runtime.tar.gz
          curl -fSL "$BASE/$ASSET.sha256" -o workers/python-runtime.tar.gz.sha256
          EXPECTED=$(node -e "process.stdout.write(require('fs').readFileSync('workers/python-runtime.tar.gz.sha256','utf8').trim().split(/\\s+/)[0])")
          ACTUAL=$(node -e "const fs=require('fs'),c=require('crypto');process.stdout.write(c.createHash('sha256').update(fs.readFileSync('workers/python-runtime.tar.gz')).digest('hex'))")
          test "$EXPECTED" = "$ACTUAL"
          rm workers/python-runtime.tar.gz.sha256

      - name: Build Next standalone and Electron resources
        env:
          TELEMETRY_ENDPOINT: ${{ secrets.TELEMETRY_ENDPOINT }}
          TELEMETRY_TOKEN: ${{ secrets.TELEMETRY_TOKEN }}
        run: |
          pnpm run build
          pnpm run electron:prepare

      - name: Build macOS
        if: matrix.macos == true
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.electron_args }} --publish never

      - name: Build Windows
        if: matrix.macos == false
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
        run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.electron_args }} --publish never

      - name: Verify macOS signature, notarization and staple
        if: matrix.macos == true
        shell: bash
        run: |
          APP_PATH=$(find dist-electron -path '*/Finwork.app' -type d -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Verify Windows Authenticode signatures
        if: matrix.macos == false
        shell: pwsh
        run: |
          $targets = @("dist-electron/win-unpacked/Finwork.exe") + (Get-ChildItem dist-electron -File -Filter "*.exe" | ForEach-Object FullName)
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature: $target ($($signature.Status))"
            }
          }

      - name: List release artifacts
        if: always()
        shell: bash
        run: find dist-electron -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Verify packaged Node, Python and runtime lock (macOS)
        if: matrix.macos == true
        shell: bash
        run: |
          APP_RESOURCES=$(find dist-electron -path '*/Finwork.app/Contents/Resources' -type d -print -quit)
          test -n "$APP_RESOURCES"
          node scripts/electron-resource-smoke.mjs "$APP_RESOURCES" --install-python-deps

      - name: Verify packaged Node, Python and runtime lock (Windows)
        if: matrix.macos == false
        run: node scripts/electron-resource-smoke.mjs dist-electron/win-unpacked/resources --install-python-deps

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}-${{ matrix.node_arch }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: release-input
      - name: Merge updater metadata
        run: node scripts/merge-electron-release.mjs release-input dist-release
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
